{% extends "base.html" %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}

<div class="container">

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete
        <strong>"{{ post.title }}"</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="POST"
        onsubmit="return confirm('Final confirmation: Do you really want to permanently delete this post?');">

        <button type="submit">
            🗑 Delete Post
        </button>

        <a href="{{ url_for('admin.posts') }}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
